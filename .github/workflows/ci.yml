name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both legs must report: a debug-flavour failure is a real memory bug and
      # cancelling the release leg over it (or vice versa) hides half the story.
      fail-fast: false
      matrix:
        # Which flavour of librayforce.a to link. `debug` compiles the core with
        # -DDEBUG, arming the engine's stale retain/release detector (DFD) — see
        # rayforce-sys/build.rs. ASan cannot see into the engine's mmap-backed
        # pool allocator, so DFD is the only tool for this bug class.
        core: [release, debug]
    steps:
      # The C core and the rayforce-q client are submodules under
      # rayforce-sys/vendor/, so this one checkout brings the whole build.
      - name: Checkout bindings
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check vendored core pin
        run: ./scripts/check-vendored-pin.sh

      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential

      # bindgen needs to be told where libclang lives on the runner.
      - name: Locate libclang
        run: |
          LIB="$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -1)"
          if [ -z "$LIB" ]; then echo "libclang not found" >&2; exit 1; fi
          echo "LIBCLANG_PATH=$(dirname "$LIB")" >> "$GITHUB_ENV"
          echo "Using LIBCLANG_PATH=$(dirname "$LIB")"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.core }}-${{ hashFiles('**/Cargo.toml') }}

      # Lints are flavour-independent; running them twice only doubles the wait.
      - name: Format check
        if: matrix.core == 'release'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.core == 'release'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          # Empty on the release leg. build.rs and the core's own dfd_enabled()
          # both treat empty and "0" as off, so the release leg is unaffected.
          RAYFORCE_CORE_DEBUG: ${{ matrix.core == 'debug' && '1' || '' }}
          RAY_DFD: ${{ matrix.core == 'debug' && '1' || '' }}
        run: cargo test --workspace

      # The vendored sources must actually land in the .crate — that is the
      # whole reason docs.rs and other network-isolated builds work. Cheap to
      # check here, and a broken package is invisible until someone consumes it.
      - name: Check the packaged crate carries the vendored core
        run: |
          cargo package -p rayforce-sys --list --allow-dirty > /tmp/pkg.txt
          for f in vendor/rayforce/include/rayforce.h vendor/rayforce/Makefile vendor/rayforce-q/q.c; do
            grep -qx "$f" /tmp/pkg.txt || { echo "::error::$f missing from the packaged crate"; exit 1; }
          done
          if grep -qE '\.(o|d)$' /tmp/pkg.txt; then
            echo "::error::build artifacts leaked into the packaged crate"; exit 1
          fi
          echo "packaged $(wc -l < /tmp/pkg.txt) files"
